<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racetracks | Pace &amp; Publish</title>
<meta name="description" content="An interactive world map of the racetracks that matter across F1, MotoGP, WEC, NASCAR, IMSA and IndyCar.">
<meta name="theme-color" content="#0C0C12">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/images/logo/logo-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="tracks">
<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <header class="page-head">
      <div class="stripe" aria-hidden="true"><span></span></div>
      <h1 tabindex="-1">Racetracks</h1>
      <p class="page-intro" id="map-intro">Hover over a marker to see the track name, or select it for a summary. Use the list beside the map to jump to any track.</p>
    </header>
    <div class="map-layout" id="map-top">
      <div class="map-wrap" id="map-wrap">
        <div id="track-map" role="region" aria-label="World map of racetracks"></div>
        <div class="map-offline"><p>The map could not load. Every track is still listed beside it and described below.</p></div>
      </div>
      <div class="track-panel">
        <div class="track-panel-head">
          <h2 id="track-list-title">All tracks</h2>
          <div class="filter" id="track-filter" role="group" aria-label="Filter tracks by series"></div>
        </div>
        <ul class="track-list" id="track-list" aria-labelledby="track-list-title"></ul>
      </div>
    </div>
    <div id="tracks-list"></div>
  </div>
</main>

<div id="site-footer"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/world/land-50m.js"></script>
<script src="data/series.js"></script>
<script src="data/photos.js"></script>
<script src="data/sources.js"></script>
<script src="data/series-history.js"></script>
<script src="data/terms.js"></script>
<script src="data/tactics.js"></script>
<script src="data/tracks.js"></script>
<script src="data/races.js"></script>
<script src="js/core.js"></script>
<script src="js/layout.js"></script>
<script src="js/features/guide.js"></script>
<script>PP.guide.renderTracks();</script>
</body>
</html>
