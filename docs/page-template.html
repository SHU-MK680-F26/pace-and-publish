<!doctype html>
<!--
  Page template. To add a page:
    1. Copy this file to the site root (next to index.html) and rename it, e.g. car-types.html.
    2. Change TITLE, DESCRIPTION, data-page, the heading, intro and content.
    3. Add one line to NAV in js/layout.js, e.g. under Learn:
         { id: "car-types", label: "Car types", href: "car-types.html", note: "Short description" },
    4. Load only the data and feature files the page uses (order: data → core → layout → features).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITLE | Pace &amp; Publish</title>
<meta name="description" content="DESCRIPTION">
<meta name="theme-color" content="#0C0C12">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/images/logo/logo-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="car-types">
<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <header class="page-head">
      <div class="stripe" aria-hidden="true"><span></span></div>
      <h1 tabindex="-1">Heading</h1>
      <p class="page-intro">One or two sentences on what this page is for.</p>
    </header>

    <section class="section" aria-labelledby="first-title">
      <div class="section-head"><h2 id="first-title">Section</h2><p>Optional intro.</p></div>
      <p>Content.</p>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script src="data/series.js"></script>
<script src="js/core.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
